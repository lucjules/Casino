<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <title>Royal Fortuna — Casino (jetons fictifs)</title>
  <meta name="description" content="Royal Fortuna : un casino 2D 100 % fictif — machines à sous, blackjack, roulette, poker, dés, quêtes et progression.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="vert">
  <div id="app">
    <header id="hud">
      <button id="brand" class="brand" aria-label="Retour au lobby"><span class="brand-ico">♛</span><span class="brand-txt">ROYAL <b>FORTUNA</b></span></button>
      <nav id="nav">
        <button data-go="lobby" class="active"><span>🏛️</span><em>Lobby</em></button>
        <button data-go="quests"><span>📜</span><em>Quêtes</em><i id="badge-quests" class="badge" hidden>0</i></button>
        <button data-go="shop"><span>🛍️</span><em>Boutique</em></button>
        <button data-go="profile"><span>👤</span><em>Profil</em></button>
      </nav>
      <div class="hud-right">
        <div class="hud-money" title="Jetons (fictifs)"><span class="chip-ico big"></span><b id="hud-money">0</b></div>
        <div class="hud-level">
          <div class="lvl-badge" id="hud-level">1</div>
          <div class="lvl-info"><div class="lvl-line"><span id="hud-name">Invité</span><span class="sep"> · </span><span id="hud-rank">Novice</span></div>
            <div class="xpbar"><div id="hud-xpbar"></div></div><div class="xptext" id="hud-xptext"></div></div>
        </div>
        <button id="btn-sound" class="icon-btn" aria-label="Son">🔊</button>
      </div>
    </header>
    <main id="view"></main>
    <footer>🎲 Royal Fortuna — jeu de divertissement. Tous les jetons sont fictifs : aucun argent réel, aucun gain réel.</footer>
  </div>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <div id="bigwin"></div>
  <canvas id="fx"></canvas>

  <script src="js/slots-engine.js"></script>
  <script src="js/core.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/blackjack.js"></script>
  <script src="js/roulette.js"></script>
  <script src="js/poker.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/scratch.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
